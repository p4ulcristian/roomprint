<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Prints · Roomprint</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icon-64.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .day { margin: 26px 0 10px; font-size: .95rem; color: var(--muted, #6b7280); font-weight: 600; }
  .space { display: flex; flex-direction: column; gap: 8px; margin: 0; color: inherit; text-decoration: none; }
  .space:hover { border-color: #9aa7b4; }
  .thumb { aspect-ratio: 4 / 3; background: #fbfdff; border-radius: 10px; display: flex; align-items: center;
           justify-content: center; overflow: hidden; border: 1px solid var(--line); }
  .thumb svg { width: 100%; height: 100%; }
  .thumb .muted { font-size: .85rem; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: .75rem; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #e9edf2; }
  .tag.state-failed { background: #fde2e2; color: #9b1c1c; }
  .tag.state-processing, .tag.state-queued { background: #fff1d6; color: #8a5a00; }
  .rooms { font-size: .85rem; color: var(--muted, #6b7280); }
  .space { position: relative; }
  .remove { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; padding: 0;
            border: 1px solid var(--line); background: rgba(255,255,255,.92); color: var(--bad, #b42318);
            font-size: 18px; line-height: 1; cursor: pointer; opacity: .75; }
  .remove:hover { opacity: 1; background: #fde2e2; }
  dialog { border: 0; border-radius: 16px; padding: 22px; max-width: 380px; width: calc(100% - 32px);
           box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(15,23,42,.45); }
  dialog h2 { margin: 0 0 8px; font-size: 1.2rem; }
  dialog p { margin: 0 0 16px; color: var(--muted, #6b7280); }
  dialog .actions { display: flex; gap: 10px; justify-content: flex-end; }
  dialog button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 10px; cursor: pointer;
                  border: 1px solid var(--line); background: #fff; color: var(--ink); }
  dialog button.danger { background: var(--bad, #b42318); border-color: transparent; color: #fff; }
  dialog button:disabled { opacity: .6; cursor: default; }
  #removeErr { color: var(--bad, #b42318); margin: -6px 0 12px; }
  .wide-wrap { max-width: 1200px; margin: 0 auto; padding: 18px 16px 48px; }
</style>
</head>
<body>
<main class="wide-wrap">
  <div class="brand"><img src="/static/icon-64.png" alt="">Roomprint</div>
  <h1>Prints</h1>
  <div id="list"><p class="muted">Loading…</p></div>
</main>
<dialog id="confirm">
  <h2>Delete “<span id="cName"></span>”?</h2>
  <p>This deletes it from the server for good: <span id="cWhat"></span>. Its links stop working for everyone. There is no undo and no backup.</p>
  <p id="removeErr" class="hidden"></p>
  <div class="actions">
    <button type="button" id="cCancel">Cancel</button>
    <button type="button" id="cRemove" class="danger">Delete</button>
  </div>
</dialog>
<script type="module">
  import { normalize } from "/static/geom.js";
  import { renderBlueprint } from "/static/blueprint.js";

  const parts = location.pathname.split("/").filter(Boolean);
  const prints = parts[0] === "prints";   // removing is only offered behind the admins login
  const api = prints ? "/api/prints" : `/api/admin/${parts.pop()}`;
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const VIDEO = /\.(mov|mp4|m4v|webm|3gp|mkv)$/i;

  function dayLabel(d) {
    const start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((start(new Date()) - start(d)) / 864e5);
    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  function card(s) {
    const created = new Date(s.created);
    const scans = s.clips.filter(c => /\.roomplan$/i.test(c.filename)).length;
    const videos = s.clips.filter(c => VIDEO.test(c.filename)).length;
    const tags = [];
    if (s.status.state !== "done") tags.push(`<span class="tag state-${s.status.state}">${esc(s.status.state)}</span>`);
    if (scans) tags.push(`<span class="tag">LiDAR scan</span>`);
    if (videos) tags.push(`<span class="tag">${videos > 1 ? videos + " videos" : "Video"}</span>`);
    if (s.pending) tags.push(`<span class="tag state-queued">${s.pending} upload${s.pending > 1 ? "s" : ""} unfinished</span>`);
    const rooms = s.rooms
      ? s.rooms.map(r => `${esc(r.name)} ${r.area} m²`).join(" · ")
      : esc(s.status.step);
    return `<a class="card space" href="/s/${s.token}" data-token="${s.token}" data-id="${s.id}" data-has="${s.rooms ? 1 : 0}">
      ${prints ? `<button class="remove" type="button" title="Delete" aria-label="Delete">×</button>` : ""}
      <div class="thumb"><span class="muted">${s.rooms ? "" : "No plan yet"}</span></div>
      <div class="row"><strong>${esc(s.name)}</strong><span class="muted small">${created.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}</span></div>
      <div class="rooms">${rooms}</div>
      <div class="tags">${tags.join("")}</div>
    </a>`;
  }

  async function load() {
    const res = await fetch(api);
    if (!res.ok) { document.getElementById("list").innerHTML = `<p class="muted">Not found.</p>`; return; }
    const { spaces } = await res.json();
    byId = new Map(spaces.map(s => [s.id, s]));
    const days = [];
    for (const s of spaces) {
      const label = dayLabel(new Date(s.created));
      if (!days.length || days.at(-1).label !== label) days.push({ label, items: [] });
      days.at(-1).items.push(s);
    }
    document.getElementById("list").innerHTML = days.map(d =>
      `<h2 class="day">${esc(d.label)}</h2><div class="grid">${d.items.map(card).join("")}</div>`).join("")
      || `<p class="muted">No spaces yet.</p>`;

    // Mini floor plans, drawn by the same code as the viewer's Blueprint tab.
    for (const el of document.querySelectorAll('.space[data-has="1"]')) {
      fetch(`/api/s/${el.dataset.token}/space.json`).then(r => r.json()).then(sp => {
        el.querySelector(".thumb").innerHTML = renderBlueprint(normalize(sp), { furniture: true });
      }).catch(() => {});
    }
  }
  let byId = new Map(), target = null;
  const dlg = document.getElementById("confirm"), removeBtn = document.getElementById("cRemove");
  const removeErr = document.getElementById("removeErr");

  document.getElementById("list").addEventListener("click", e => {
    const btn = e.target.closest(".remove");
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    target = byId.get(btn.closest(".space").dataset.id);
    if (!target) return;
    const n = target.clips.length, rooms = target.rooms?.length ?? 0;
    document.getElementById("cName").textContent = target.name;
    document.getElementById("cWhat").textContent =
      [rooms && `${rooms} room${rooms > 1 ? "s" : ""}`, `${n} uploaded file${n === 1 ? "" : "s"}`].filter(Boolean).join(" and ");
    removeErr.classList.add("hidden");
    removeBtn.disabled = false; removeBtn.textContent = "Delete";
    dlg.showModal();
    document.getElementById("cCancel").focus();
  });
  document.getElementById("cCancel").addEventListener("click", () => dlg.close());
  removeBtn.addEventListener("click", async () => {
    removeBtn.disabled = true; removeBtn.textContent = "Deleting…";
    try {
      const res = await fetch(`/api/prints/${target.id}`, { method: "DELETE" });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || "could not delete it");
      dlg.close();
      load();
    } catch (err) {
      removeErr.textContent = err.message.charAt(0).toUpperCase() + err.message.slice(1) + ".";
      removeErr.classList.remove("hidden");
      removeBtn.disabled = false; removeBtn.textContent = "Delete";
    }
  });

  load();
</script>
</body>
</html>
